name: Speedlimit
options:
  bundleIdPrefix: tw.speedlimit
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "8"
    CODE_SIGN_STYLE: Automatic
targets:
  Speedlimit:
    type: application
    platform: iOS
    sources:
      - path: Speedlimit
        excludes: [Resources]
      - path: Speedlimit/Resources
        buildPhase: resources
    dependencies:
      - target: SpeedlimitNotificationContent
        embed: true
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tw.speedlimit.app
        CODE_SIGN_IDENTITY: "iPhone Developer"
        INFOPLIST_KEY_CFBundleDisplayName: Speedlimit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    info:
      path: Speedlimit/Info.plist
      properties:
        CFBundleDisplayName: Speedlimit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIBackgroundModes: [location, fetch]
        BGTaskSchedulerPermittedIdentifiers: [tw.speedlimit.app.refresh]
        NSLocationWhenInUseUsageDescription: Your location is used to follow your trip and match cameras to the road and direction you are travelling.
        NSLocationAlwaysAndWhenInUseUsageDescription: During a driving session, location continues in the background to warn about verified cameras on your road.
        NSLocationTemporaryUsageDescriptionDictionary:
          RoadMatching: Precise location helps distinguish nearby roads and matches camera alerts to your road and travel direction.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
  SpeedlimitNotificationContent:
    type: app-extension
    platform: iOS
    sources: [SpeedlimitNotificationContent]
    info:
      path: SpeedlimitNotificationContent/Info.plist
      properties:
        CFBundleDisplayName: Camera Card
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.content-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationViewController
          NSExtensionAttributes:
            UNNotificationExtensionCategory: CAMERA_ALERT
            UNNotificationExtensionInitialContentSizeRatio: 0.72
            UNNotificationExtensionDefaultContentHidden: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tw.speedlimit.app.CameraCard
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  SpeedlimitTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SpeedlimitTests]
    dependencies: [{target: Speedlimit}]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  SpeedlimitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SpeedlimitUITests]
    dependencies: [{target: Speedlimit}]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Speedlimit:
    build:
      targets:
        Speedlimit: all
        SpeedlimitNotificationContent: all
    test:
      targets: [SpeedlimitTests, SpeedlimitUITests]
      gatherCoverageData: true
